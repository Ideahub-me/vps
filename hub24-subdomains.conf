# 9. S8K2-NODE (Будущий шлюз для каскада через российский сервер)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name s8k2-node.hub24.me;

    ssl_certificate /etc/nginx/cf-ssl/cert.pem;
    ssl_certificate_key /etc/nginx/cf-ssl/key.pem;

    location / {
        return 404;
    }

    # Направляет транзитный трафик каскада на те же локальные порты 3X-UI
    location /s8k2-secret-path {
        proxy_pass [http://127.0.0.1:10001](http://127.0.0.1:10001);
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }
}
