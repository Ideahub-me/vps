# Общий блок редиректа с HTTP на HTTPS для всех поддоменов
server {
    listen 80;
    server_name panel.hub24.me gate.hub24.me home.hub24.me api.hub24.me app.hub24.me blog.hub24.me sync.hub24.me dash.hub24.me;
    return 301 https://$host$request_uri;
}

# --- 1. Panel ---
server {
    listen 443 ssl;
    server_name panel.hub24.me;

    ssl_certificate /etc/nginx/cf-ssl/cert.pem;
    ssl_certificate_key /etc/nginx/cf-ssl/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

