# Редирект всех HTTP-запросов на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name panel.hub24.me gate.hub24.me home.hub24.me api.hub24.me app.hub24.me blog.hub24.me sync.hub24.me dash.hub24.me;
    return 301 https://$host$request_uri;
}

# 1. PANEL (X-UI на порту 2053)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.hub24.me;

    ssl_certificate /etc/nginx/cf-ssl/cert.pem;
    ssl_certificate_key /etc/nginx/cf-ssl/key.pem;

    location / {
        proxy_pass http://127.0.0.1:2053;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

