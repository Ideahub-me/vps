# Редирект всех HTTP-запросов на HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name panel.hub24.me gate.hub24.me home.hub24.me api.hub24.me app.hub24.me blog.hub24.me sync.hub24.me dash.hub24.me s8k2-node.hub24.me;
    return 301 https://$host$request_uri;
}

# 1. PANEL (X-UI на порту 2053)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name panel.hub24.me;

    ssl_certificate /etc/nginx/cf-ssl/cert.pem;
    ssl_certificate_key /etc/nginx/cf-ssl/key.pem;

    location / {
        proxy_pass [http://127.0.0.1:2053](http://127.0.0.1:2053);
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 2. GATE (Прямые подключения клиентов через Cloudflare + VPN-связки на портах 10001-10003)
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name gate.hub24.me;

    ssl_certificate /etc/nginx/cf-ssl/cert.pem;
    ssl_certificate_key /etc/nginx/cf-ssl/key.pem;

    # Заглушка для корня или ваш сервис (если на 3002 что-то есть)
    location / {
        return 404;
    }

    # 1. VLESS + XHTTP (порт 10001 в 3X-UI)
    location /gate-xhttp-secret {
        proxy_pass [http://127.0.0.1:10001](http://127.0.0.1:10001);
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # 2. VLESS + WebSocket (порт 10002 в 3X-UI)
    location /gate-vless-ws-secret {
        proxy_pass [http://127.0.0.1:10002](http://127.0.0.1:10002);
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. Trojan + WebSocket (порт 10003 в 3X-UI)
    location /gate-trojan-ws-secret {
        proxy_pass [http://127.0.0.1:10003](http://127.0.0.1:10003);
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

